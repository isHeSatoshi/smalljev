[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smalljev"
version = "0.4.0"
description = "The open TypeSafe Jev that runs on your mama's phone. 2.5B params, one forward pass, zero generated tokens."
"Benchmark Heaven" = "https://huggingface.co/isHeSatoshi/smalljev-semantic-v9"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "smalljev contributors" },
]
requires-python = ">=3.10"
keywords = [
    "jev", "system-one", "typed-decisions", "calibrated",
    "classification", "structured-output", "logits",
    "open-weights", "transformers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "torch>=2.5",
    "transformers>=4.55",
    "peft>=0.13",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
bench = [
    "datasets>=2.20",
    "evaluate>=0.4",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
test = [
    "pytest>=8.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/isHeSatoshi/smalljev"
Repository = "https://github.com/isHeSatoshi/smalljev"
Issues = "https://github.com/isHeSatoshi/smalljev/issues"
"Benchmark Heaven" = "https://huggingface.co/isHeSatoshi/smalljev-semantic-v9"

[tool.setuptools.packages.find]
where = ["."]
include = ["smalljev*"]
exclude = ["tests*", "evals*", "examples*", "docs*", "benchmarks*", "adapters*"]

[tool.setuptools.package-data]
smalljev = ["py.typed"]
